# Pin Gradle to JDK 21 (Android Studio's JBR). The machine default is JDK 26
# (class-file major 70), which Gradle 9.1's Kotlin script compiler rejects with
# "Unsupported class file major version 70" during IDE sync. This makes both the
# IDE's Gradle sync and CLI builds use a supported JDK.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
