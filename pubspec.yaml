name: clipforge_ai
description: "ClipForge AI — AI-first mobile video editor (Phase 1 MVP shell)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI / fonts / motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Media
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  # Networking (talks to the FastAPI worker)
  dio: ^5.7.0

  # Real on-device video render/export. Upstream ffmpeg_kit was retired (2025) and
  # its arthenica AARs were pulled from public repos; this maintained fork points at
  # the republished `com.antonkarpenko:ffmpeg-kit-full-gpl` on Maven Central
  # (FFmpeg + libx264/x265 + vid.stab + subtitles). Prebuilt .so, ~108 MB AAR.
  ffmpeg_kit_flutter_new: ^4.5.2
  gal: ^2.3.2                 # save rendered video to the gallery
  permission_handler: ^12.0.3 # media/storage permissions
  share_plus: ^12.0.2        # share exported video (13.x conflicts with file_picker's win32 pin)
  # thumbnails are generated via ffmpeg (video_thumbnail 0.5.6 uses dead jcenter() + AGP 4.1)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Branded launcher icon (generated by scripts/gen_icon.py). Regenerate icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

# path_provider_android 2.3.x pulls in `jni`/`jni_flutter`, which compile native
# C++ and require a working Android NDK. This machine's NDK is corrupt, so we pin
# the last pre-jni release (pure platform-channel impl, no native build). Remove
# this override once the NDK is reinstalled.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
